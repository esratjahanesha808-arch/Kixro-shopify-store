# Kixro theme CI — Theme Check only (no Shopify store secrets required).
# Runs on pushes to main only (avoids failed runs on stale Dependabot PR branches).

name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Theme Check
        uses: shopify/theme-check-action@v2
