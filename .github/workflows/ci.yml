# Kixro theme CI — runs Theme Check only (no store secrets required).
# Replaces Dawn's Lighthouse + CLA workflows which need Shopify org secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Run Theme Check
        run: shopify theme check --fail-level error
